<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" font-family="monospace">
  <rect width="1200" height="720" fill="#0b0b0b"/>
  <text x="80" y="56" fill="#888" font-size="13">03 / STACK ————————————————————————</text>
  <text x="80" y="96" fill="#e6e6e6" font-size="30" font-family="Georgia, serif">Tech stack</text>

  <!-- globe -->
  <circle cx="330" cy="330" r="180" fill="none" stroke="#242424"/>
  <ellipse cx="330" cy="330" rx="180" ry="64" fill="none" stroke="#1e1e1e"/>
  <ellipse cx="330" cy="330" rx="64" ry="180" fill="none" stroke="#1e1e1e"/>
  <g fill="#161616" stroke="#3a3a3a">
    <circle cx="260" cy="230" r="26"/><circle cx="400" cy="250" r="24"/><circle cx="330" cy="200" r="22"/>
    <circle cx="230" cy="340" r="24"/><circle cx="430" cy="360" r="26"/><circle cx="330" cy="330" r="30"/>
    <circle cx="290" cy="430" r="22"/><circle cx="390" cy="440" r="24"/>
  </g>
  <text x="330" y="540" fill="#6a6a6a" font-size="12" text-anchor="middle">SLOT: rotating tech globe (ref 4) — mobile: static grid</text>

  <!-- click detail: skill bar + icon -->
  <rect x="600" y="150" width="520" height="200" rx="12" fill="#141414" stroke="#333"/>
  <rect x="624" y="176" width="80" height="80" rx="10" fill="#1c1c1c" stroke="#3a3a3a"/>
  <text x="664" y="222" fill="#888" font-size="12" text-anchor="middle">ICON</text>
  <text x="724" y="200" fill="#e6e6e6" font-size="20" font-family="Georgia, serif">React (selected)</text>
  <rect x="724" y="220" width="360" height="10" rx="5" fill="#222"/>
  <rect x="724" y="220" width="300" height="10" rx="5" fill="#cfcfcf"/>
  <text x="724" y="258" fill="#8a8a8a" font-size="12">skill range bar (from skills.ts tier) + evidence note</text>
  <text x="600" y="372" fill="#6a6a6a" font-size="12">on click of a globe node → this detail card (ref 5 modal on mobile)</text>

  <!-- graphs -->
  <rect x="600" y="410" width="250" height="180" rx="12" fill="#101010" stroke="#2c2c2c"/>
  <text x="725" y="440" fill="#888" font-size="12" text-anchor="middle">GITHUB contributions</text>
  <g fill="#2a2a2a">
    <rect x="618" y="460" width="10" height="10"/><rect x="632" y="460" width="10" height="10" fill="#555"/><rect x="646" y="460" width="10" height="10" fill="#888"/><rect x="660" y="460" width="10" height="10" fill="#ccc"/>
    <rect x="618" y="474" width="10" height="10" fill="#444"/><rect x="632" y="474" width="10" height="10"/><rect x="646" y="474" width="10" height="10" fill="#999"/><rect x="660" y="474" width="10" height="10" fill="#666"/>
  </g>
  <text x="725" y="576" fill="#5a5a5a" font-size="10" text-anchor="middle">live ← /api/github · fallback card if down</text>

  <rect x="870" y="410" width="250" height="180" rx="12" fill="#101010" stroke="#2c2c2c"/>
  <text x="995" y="440" fill="#888" font-size="12" text-anchor="middle">LEETCODE</text>
  <circle cx="995" cy="500" r="40" fill="none" stroke="#333" stroke-width="8"/>
  <circle cx="995" cy="500" r="40" fill="none" stroke="#ccc" stroke-width="8" stroke-dasharray="180 251" transform="rotate(-90 995 500)"/>
  <text x="995" y="576" fill="#5a5a5a" font-size="10" text-anchor="middle">live ← /api/leetcode · fallback if down</text>
</svg>
