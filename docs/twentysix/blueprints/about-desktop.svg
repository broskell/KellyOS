<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="monospace">
  <rect width="1200" height="640" fill="#0b0b0b"/>
  <text x="80" y="60" fill="#888" font-size="13">01 / ABOUT ————————————————————————</text>
  <text x="80" y="100" fill="#e6e6e6" font-size="30" font-family="Georgia, serif">About me</text>

  <!-- rotated cards entering from the right -->
  <g transform="translate(760,150) rotate(-4)">
    <rect width="360" height="150" rx="10" fill="#16182a" stroke="#33364d"/>
    <text x="24" y="46" fill="#cfd3ea" font-size="16">IIT Jodhpur</text>
    <text x="24" y="76" fill="#9aa0c0" font-size="12">BS — Applied AI &amp; Data Science</text>
    <text x="24" y="104" fill="#9aa0c0" font-size="12">CGPA: X.XX / 10</text>
  </g>
  <g transform="translate(700,330) rotate(3)">
    <rect width="380" height="140" rx="10" fill="#1c1a16" stroke="#3a352c"/>
    <text x="24" y="44" fill="#d8d2c4" font-size="14">Class XII / earlier</text>
    <text x="24" y="72" fill="#a89f8c" font-size="12">School · percentage</text>
  </g>

  <!-- motion arrows -->
  <path d="M1140 220 L1000 220" stroke="#4a4a4a" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <path d="M1140 390 L1010 390" stroke="#4a4a4a" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#4a4a4a"/></marker></defs>
  <text x="880" y="540" fill="#6a6a6a" font-size="12" text-anchor="middle">cards translate/rotate in from the right on scroll (ScrollTrigger)</text>

  <!-- left prose -->
  <rect x="80" y="150" width="520" height="320" fill="none" stroke="#222"/>
  <text x="100" y="190" fill="#b4b4b4" font-size="14">Short bio prose (--c-text-2).</text>
  <text x="100" y="214" fill="#b4b4b4" font-size="14">Who I am, what I build, focus.</text>
  <text x="100" y="250" fill="#8a8a8a" font-size="12">Reference composition: rotated "CHALLENGES" cards (ref 3)</text>
  <text x="100" y="452" fill="#6a6a6a" font-size="12">OURS — hand-coded (no 21st component)</text>
</svg>
