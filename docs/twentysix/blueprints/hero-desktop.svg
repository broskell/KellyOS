<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" font-family="monospace">
  <rect width="1200" height="720" fill="#0b0b0b"/>
  <!-- aether-flow bg slot -->
  <rect x="8" y="8" width="1184" height="704" fill="none" stroke="#2a2a2a" stroke-dasharray="4 4"/>
  <text x="20" y="30" fill="#5a5a5a" font-size="13">HERO — viewport height (~90vh) · aether-flow field behind (slot, ref 14)</text>

  <!-- left: portrait -->
  <rect x="80" y="120" width="380" height="480" rx="12" fill="#141414" stroke="#333"/>
  <line x1="80" y1="120" x2="460" y2="600" stroke="#242424"/>
  <line x1="460" y1="120" x2="80" y2="600" stroke="#242424"/>
  <text x="270" y="356" fill="#777" font-size="15" text-anchor="middle">PORTRAIT</text>
  <text x="270" y="378" fill="#555" font-size="12" text-anchor="middle">ImageWithFallback → initials</text>
  <text x="270" y="398" fill="#555" font-size="12" text-anchor="middle">grayscale, hover-recover</text>

  <!-- right: content -->
  <text x="520" y="150" fill="#888" font-size="13">KELLY.OS · 2026 EDITION  (eyebrow, mono)</text>

  <!-- image-driven particle text slot -->
  <rect x="520" y="180" width="600" height="150" fill="none" stroke="#3a3a3a" stroke-dasharray="6 5"/>
  <text x="536" y="250" fill="#c9c9c9" font-size="52" font-family="Georgia, serif">Saathvik</text>
  <text x="536" y="312" fill="#c9c9c9" font-size="52" font-family="Georgia, serif">Kellampalli</text>
  <text x="536" y="356" fill="#6a6a6a" font-size="12">SLOT: particle / image-driven headline (ref 1) — falls back to static serif</text>

  <!-- lead -->
  <rect x="520" y="378" width="520" height="54" fill="none" stroke="#222"/>
  <text x="532" y="404" fill="#9a9a9a" font-size="14">Lead paragraph — one or two lines, --c-text-2.</text>

  <!-- socials + resume -->
  <g>
    <circle cx="540" cy="490" r="22" fill="#141414" stroke="#333"/><text x="540" y="495" fill="#888" font-size="11" text-anchor="middle">GH</text>
    <circle cx="596" cy="490" r="22" fill="#141414" stroke="#333"/><text x="596" y="495" fill="#888" font-size="11" text-anchor="middle">in</text>
    <circle cx="652" cy="490" r="22" fill="#141414" stroke="#333"/><text x="652" y="495" fill="#888" font-size="11" text-anchor="middle">@</text>
    <rect x="700" y="468" width="150" height="44" rx="22" fill="#f2f2f2"/><text x="775" y="495" fill="#0b0b0b" font-size="14" text-anchor="middle">Resume ↗</text>
  </g>
  <text x="520" y="548" fill="#5a5a5a" font-size="12">GitHub · LinkedIn · Email (icon links) + Resume button (existence-checked)</text>

  <!-- dock -->
  <rect x="360" y="628" width="480" height="64" rx="20" fill="#161616" stroke="#3a3a3a" stroke-dasharray="6 5"/>
  <g fill="#222" stroke="#3a3a3a">
    <rect x="384" y="642" width="36" height="36" rx="9"/><rect x="430" y="642" width="36" height="36" rx="9"/>
    <rect x="476" y="642" width="36" height="36" rx="9"/><rect x="522" y="642" width="36" height="36" rx="9"/>
    <rect x="568" y="642" width="36" height="36" rx="9"/><rect x="614" y="642" width="36" height="36" rx="9"/>
    <rect x="660" y="642" width="36" height="36" rx="9"/><rect x="706" y="642" width="36" height="36" rx="9"/>
  </g>
  <text x="600" y="620" fill="#6a6a6a" font-size="12" text-anchor="middle">DOCK — fixed, glass, magnify on hover (slot, ref 2)</text>
</svg>
